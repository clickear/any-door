name: Build Plugin

on:
  push:
    branches:
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and install core and attach modules
        run: mvn -B -ntp -P '!ossrh,!release' install

      - name: Build IDEA plugin package
        working-directory: any-door-plugin
        run: bash ./gradlew --no-daemon buildPlugin

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: any-door-plugin
          path: any-door-plugin/build/distributions/*.zip
          if-no-files-found: error

      - name: Run plugin tests
        working-directory: any-door-plugin
        run: bash ./gradlew --no-daemon test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: any-door-test-reports
          path: |
            **/target/surefire-reports/**
            any-door-plugin/build/reports/tests/**
            any-door-plugin/build/test-results/**
          if-no-files-found: ignore

name: Release Plugin

on:
  push:
    branches:
      - "feature/java-expression-mode"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and install Any Door jars to local Maven repo
        run: mvn -B -ntp -P '!ossrh,!release' -Dmaven.test.skip=true install

      - name: Build IDEA plugin package
        working-directory: any-door-plugin
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --refresh-dependencies buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: any-door-plugin
          path: any-door-plugin/build/distributions/*.zip
          if-no-files-found: error

      - name: Publish plugin to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: any-door-plugin/build/distributions/*.zip

      - name: Publish plugin prerelease for feature branch
        if: github.ref == 'refs/heads/feature/java-expression-mode'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-java-expression-mode-${{ github.run_number }}
          name: prerelease-java-expression-mode-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: any-door-plugin/build/distributions/*.zip

name: Release Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and install Any Door jars to local Maven repo
        run: mvn -B -ntp -P '!ossrh,!release' -DskipTests install

      - name: Build IDEA plugin package
        working-directory: any-door-plugin
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: any-door-plugin
          path: any-door-plugin/build/distributions/*.zip
          if-no-files-found: error

      - name: Publish plugin to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: any-door-plugin/build/distributions/*.zip
